<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1917;">
  <span style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="padding:0 0 16px 4px;">
              <span style="display:inline-block;background:linear-gradient(135deg,#f97316,#ea580c);background-color:#ea580c;color:#0a0a0a;font-weight:700;font-size:13px;padding:6px 8px;border-radius:6px;">PMS</span>
              <span style="font-weight:600;font-size:15px;margin-left:8px;vertical-align:middle;">Project Management</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border:1px solid #e7e5e4;border-top:4px solid #ea580c;border-radius:8px;padding:32px 28px;">
              <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">{% block heading %}{% endblock %}</h1>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Hello {{ name }},</p>
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 4px 0;font-size:12px;line-height:1.5;color:#78716c;">
              {% if college_name %}{{ college_name }} · {% endif %}This is an automated message from PMS. Please do not reply.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
