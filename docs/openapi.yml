  /api/v1/college/:
    get:
      operationId: college_retrieve
      tags:
      - college
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/College'
          description: ''
  /api/v1/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: GET /dashboard/ — counts and pending setup work for the College
        Admin.
      tags:
      - dashboards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/evaluations/:
    get:
      operationId: evaluations_list
      description: /evaluations/ — every team × phase with its evaluator, submission
        and marks.
      parameters:
      - in: query
        name: evaluated
        schema:
          type: boolean
      - in: query
        name: evaluator_id
        schema:
          type: number
      - in: query
        name: evaluator_pending
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: 'Order by: phase, team (prefix - for descending).'
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phase_id
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester_id
        schema:
          type: number
      - in: query
        name: semester_subject_id
        schema:
          type: number
      - in: query
        name: team_id
        schema:
          type: number
      tags:
      - evaluations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
  /api/v1/evaluations/{id}/:
    get:
      operationId: evaluations_retrieve
      description: /evaluations/ — every team × phase with its evaluator, submission
        and marks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluator assignment.
        required: true
      tags:
      - evaluations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/evaluations/{id}/marks/:
    put:
      operationId: evaluations_marks_update
      description: Correct marks the evaluator already entered (phase must be unlocked
        and past its end date).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluator assignment.
        required: true
      tags:
      - evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarksRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/faculty/:
    get:
      operationId: faculty_list
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - name: ordering
        required: false
        in: query
        description: 'Order by: name, created_at, last_login_at (prefix - for descending).'
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
      tags:
      - faculty
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacultyList'
          description: ''
    post:
      operationId: faculty_create
      description: Shared CRUD + account actions for Faculty and Student profiles.
      tags:
      - faculty
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
          description: ''
  /api/v1/faculty/{id}/:
    get:
      operationId: faculty_retrieve
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculty
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyDetail'
          description: ''
    patch:
      operationId: faculty_partial_update
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
