components:
  schemas:
    BulkIdsRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 500
          minItems: 1
      required:
      - ids
    BulkMappingRequest:
      type: object
      properties:
        semester_subject_id:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
          minItems: 1
      required:
      - items
      - semester_subject_id
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    ClassStudent:
      type: object
      description: 'Student as managed by their class teacher: the section is fixed
        to the teacher''s section.'
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30
        status:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
        roll_number:
          type: string
          maxLength: 100
        semester:
          allOf:
          - $ref: '#/components/schemas/SemesterBrief'
          readOnly: true
        section:
          allOf:
          - $ref: '#/components/schemas/SectionBrief'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activated_at
      - created_at
      - email
      - id
      - last_login_at
      - must_change_password
      - name
      - roll_number
      - section
      - semester
      - status
      - updated_at
      - user_id
    ClassStudentRequest:
      type: object
      description: 'Student as managed by their class teacher: the section is fixed
        to the teacher''s section.'
