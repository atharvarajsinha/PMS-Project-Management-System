  /api/v1/imports/{kind}/:
    post:
      operationId: imports_create
      description: POST /imports/{kind}/ (multipart `file`) — `dry_run=true` validates
        only and saves nothing.
      parameters:
      - in: query
        name: dry_run
        schema:
          type: boolean
        description: Validate and preview without saving
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
