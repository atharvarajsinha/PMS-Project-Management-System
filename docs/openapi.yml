  /api/v1/faculty/:
    get:
      operationId: faculty_list
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - name: ordering
        required: false
        in: query
        description: 'Order by: name, created_at, last_login_at (prefix - for descending).'
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
      tags:
      - faculty
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacultyList'
          description: ''
    post:
      operationId: faculty_create
      description: Shared CRUD + account actions for Faculty and Student profiles.
      tags:
      - faculty
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
          description: ''
