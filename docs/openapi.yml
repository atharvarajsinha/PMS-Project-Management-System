          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFacultyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
          description: ''
    delete:
      operationId: faculty_destroy
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculty
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/faculty/{id}/activate/:
    post:
      operationId: faculty_activate_create
      description: Shared CRUD + account actions for Faculty and Student profiles.
      parameters:
      - in: path
