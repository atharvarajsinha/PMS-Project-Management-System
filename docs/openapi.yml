components:
  schemas:
    Assignment:
      type: object
      description: One team in one phase, for its evaluator or the Admin. Includes
        marks — never shown to students.
      properties:
        id:
          type: integer
          readOnly: true
        phase:
          $ref: '#/components/schemas/PhaseBrief'
        semester_subject:
          type: object
          additionalProperties: {}
          readOnly: true
        team:
          type: object
          additionalProperties: {}
          readOnly: true
        evaluator:
          allOf:
          - $ref: '#/components/schemas/FacultyBrief'
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        submission:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        evaluation:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        can_edit_marks:
          type: boolean
          readOnly: true
      required:
      - can_edit_marks
      - evaluation
      - evaluator
      - id
      - max_marks
      - phase
      - semester_subject
      - submission
      - team
    AssignmentIdRequest:
      type: object
      properties:
        assignment_id:
          type: integer
          minimum: 1
      required:
      - assignment_id
    AvailableMentor:
      type: object
      description: 'What a student sees when choosing a mentor: available or full,
        never the counts.'
      properties:
        faculty:
          $ref: '#/components/schemas/FacultyBrief'
        available:
          type: boolean
          readOnly: true
      required:
      - available
      - faculty
    BulkIdsRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 500
          minItems: 1
      required:
      - ids
    BulkMappingRequest:
      type: object
      properties:
        semester_subject_id:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
          minItems: 1
      required:
      - items
      - semester_subject_id
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    ClassStudent:
      type: object
      description: 'Student as managed by their class coordinator: the section is fixed
        to the teacher''s section.'
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30
        status:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
        roll_number:
          type: string
          maxLength: 100
        semester:
          allOf:
          - $ref: '#/components/schemas/SemesterBrief'
          readOnly: true
        section:
          allOf:
          - $ref: '#/components/schemas/SectionBrief'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activated_at
      - created_at
      - email
      - id
      - last_login_at
      - must_change_password
      - name
      - roll_number
      - section
      - semester
      - status
      - updated_at
      - user_id
    ClassStudentRequest:
      type: object
      description: 'Student as managed by their class coordinator: the section is fixed
        to the teacher''s section.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30
