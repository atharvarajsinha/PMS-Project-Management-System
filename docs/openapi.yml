openapi: 3.0.3
info:
  title: PMS API
  version: 1.0.0
  description: Project Management System API. See docs/API.md for conventions.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: No authentication, but unsafe methods still need a valid CSRF token.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
