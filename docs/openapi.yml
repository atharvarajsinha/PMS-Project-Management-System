          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30
        roll_number:
          type: string
          minLength: 1
          maxLength: 100
      required:
