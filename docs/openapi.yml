  /api/v1/my/class-sections/{section_pk}/students/:
    get:
      operationId: my_class_sections_students_list
      description: /my/class-sections/{section_pk}/students/ — the class coordinator manages
        their students.
      parameters:
      - name: ordering
        required: false
        in: query
        description: 'Order by: name, roll_number, created_at (prefix - for descending).'
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: section_id
        schema:
          type: number
      - in: path
        name: section_pk
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: semester_id
        schema:
          type: number
      - in: query
        name: status
        schema:
